services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docmansystem
      POSTGRES_USER: docmansystem
      POSTGRES_PASSWORD: docmansystem
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmansystem -d docmansystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:web -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
      WEB_ORIGIN: http://localhost:3000

  api:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run db:setup && npm run dev:api"
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://docmansystem:docmansystem@postgres:5432/docmansystem?schema=public
      TRUST_PROXY: loopback, linklocal, uniquelocal
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api

volumes:
  postgres-data:
