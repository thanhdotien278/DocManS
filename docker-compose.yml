services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docmansystem
      POSTGRES_USER: docmansystem
      POSTGRES_PASSWORD: docmansystem
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmansystem -d docmansystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:web -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
      WEB_ORIGIN: http://localhost:3000

  api:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run db:setup && npm run dev:api"
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://docmansystem:docmansystem@postgres:5432/docmansystem?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: rtms-files
      MINIO_REGION: us-east-1
      MINIO_USE_SSL: false
      FILE_MAX_UPLOAD_BYTES: 10485760
      FILE_ALLOWED_EXTENSIONS: .doc,.docx,.pdf,.xls,.xlsx
      TRUST_PROXY: loopback, linklocal, uniquelocal
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  minio-data:
