server {
  listen 80;
  server_name _;
  # Above the largest single upload the API accepts (50 MB intake template) plus multipart overhead.
  client_max_body_size 60m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    # $remote_addr, not $proxy_add_x_forwarded_for: a client-supplied header must not reach the API (rate limit, audit IP).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    # $remote_addr, not $proxy_add_x_forwarded_for: a client-supplied header must not reach the API (rate limit, audit IP).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
