# Giữ X-Forwarded-Proto từ Cloudflare Tunnel nếu có, fallback về $scheme khi truy cập nội bộ.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

# Giữ X-Request-Id từ proxy ngoài nếu có, ngược lại dùng $request_id của nginx để truy vết từ nginx → api.
map $http_x_request_id $req_id {
  default $http_x_request_id;
  "" $request_id;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  # Above the largest single upload the API accepts (50 MB intake template) plus multipart overhead.
  client_max_body_size 60m;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    # $remote_addr, not $proxy_add_x_forwarded_for: a client-supplied header must not reach the API (rate limit, audit IP).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-Id $req_id;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    # $remote_addr, not $proxy_add_x_forwarded_for: a client-supplied header must not reach the API (rate limit, audit IP).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-Id $req_id;
  }
}
